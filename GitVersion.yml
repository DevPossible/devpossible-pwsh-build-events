# GitVersion 6.x Configuration
# Calculates version from tags + conventional commits
# See: https://gitversion.net/docs/reference/configuration

workflow: GitFlow/v1

# Starting version if no tags exist
next-version: 1.0.0

# Tag prefix for version tags
tag-prefix: 'v'

# Conventional Commits - determine version bump from commit messages
major-version-bump-message: '(\+semver:\s?(major|breaking))|(^(feat|fix|refactor|perf|build|ci|docs|style|test|chore)(\(.+\))?!:)|(BREAKING CHANGE:)'
minor-version-bump-message: '(\+semver:\s?minor)|(^feat(\(.+\))?:)'
patch-version-bump-message: '(\+semver:\s?patch)|(^fix(\(.+\))?:)'
no-bump-message: '(\+semver:\s?(none|skip))'

# Use commit messages to determine increment
commit-message-incrementing: Enabled

# Branch configuration
branches:
  main:
    mode: ContinuousDeployment
    label: ''
    increment: Patch
    regex: ^main$
    source-branches: []
    tracks-release-branches: false
    is-release-branch: true

  pull-request:
    mode: ContinuousDelivery
    label: pr
    label-number-pattern: '[/-](?<number>\d+)'
    increment: Inherit
    regex: ^(pull|pull-requests|pr)[/-]

# Don't increment if HEAD is already tagged
prevent-increment-when-current-commit-tagged: true

# Assembly info format
assembly-versioning-scheme: MajorMinorPatch
assembly-file-versioning-scheme: MajorMinorPatch
assembly-informational-format: '{SemVer}+{ShortSha}'

# Update Azure DevOps build number
update-build-number: true
