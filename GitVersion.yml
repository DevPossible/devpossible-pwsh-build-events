# GitVersion 6.x Configuration
# See: https://gitversion.net/docs/reference/configuration

# Tag prefix for version tags
tag-prefix: 'v'

# Allow parsing of loose version formats
semantic-version-format: Loose

# Conventional Commits - determine version bump from commit messages
major-version-bump-message: '(\+semver:\s?(major|breaking))|(BREAKING CHANGE:)'
minor-version-bump-message: '(\+semver:\s?minor)|(^feat(\(.+\))?:)'
patch-version-bump-message: '(\+semver:\s?patch)|(^fix(\(.+\))?:)'

# Use commit messages to determine increment
commit-message-incrementing: Enabled

# Update Azure DevOps build number
update-build-number: true

# Branch configuration
branches:
  main:
    regex: ^master$|^main$
    mode: ContinuousDelivery
    label: ''
    increment: Patch
    is-release-branch: true
    source-branches: []
    tracks-release-branches: false
    is-source-branch-for: []
    pre-release-weight: 55000
  develop:
    regex: ^dev(elop)?(ment)?$
    mode: ContinuousDeployment
    label: alpha
    increment: Minor
    source-branches:
      - main
  feature:
    regex: ^features?[/-]
    mode: ContinuousDeployment
    label: alpha
    increment: Inherit
    source-branches:
      - develop
      - main
