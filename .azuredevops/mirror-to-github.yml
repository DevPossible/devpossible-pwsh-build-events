# Mirror to GitHub Pipeline (DEPRECATED)
# Mirroring is now handled by the Build and Publish pipeline
# This pipeline is kept for manual runs only
#
# GitHub repo: https://github.com/DevPossible/devpossible-pwsh-build-events

trigger: none  # Disabled - mirroring now part of Build and Publish pipeline

pool:
  vmImage: 'ubuntu-latest'

variables:
  githubRepo: 'DevPossible/devpossible-pwsh-build-events'

jobs:
- job: Mirror
  displayName: 'Mirror to GitHub'
  steps:
  - checkout: self
    fetchDepth: 0
    persistCredentials: true

  - task: Bash@3
    displayName: 'Configure Git'
    inputs:
      targetType: inline
      script: |
        git config user.email "pipelines@devpossible.com"
        git config user.name "Azure Pipelines"

  - task: Bash@3
    displayName: 'Push to GitHub'
    inputs:
      targetType: inline
      script: |
        echo "Adding GitHub remote..."
        git remote add github "https://$(GitHubPAT)@github.com/$(githubRepo).git"

        echo "Pushing all branches..."
        git push github --all --force

        echo "Pushing tags..."
        git push github --tags --force

        echo "Mirror complete!"
    env:
      GitHubPAT: $(GitHubPAT)
