# Build and Publish NuGet Package Pipeline
# Uses GitVersion for conventional commit versioning
# Mirrors to GitHub, publishes to nuget.org, creates GitHub Release
# Flow: Build -> Mirror to GitHub -> Publish to NuGet -> GitHub Release

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  projectPath: 'src/DevPossible.PwshBuildEvents/DevPossible.PwshBuildEvents.csproj'
  githubRepo: 'DevPossible/devpossible-pwsh-build-events'

stages:
- stage: Build
  displayName: 'Build & Test'
  jobs:
  - job: Build
    displayName: 'Build Package'
    steps:
    - checkout: self
      fetchDepth: 0  # Full history needed for GitVersion

    - task: gitversion-setup@4.2.0
      displayName: 'Install GitVersion'
      inputs:
        versionSpec: '6.x'

    - task: gitversion-execute@4.2.0
      name: GitVersion
      displayName: 'Calculate Version'
      inputs:
        useConfigFile: true
        configFilePath: 'GitVersion.yml'

    # Show calculated version
    - script: |
        echo "GitVersion: $(GitVersion.majorMinorPatch)"
      displayName: 'Show Version'

    - task: UseDotNet@2
      displayName: 'Use .NET SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '$(projectPath)'
        arguments: '-c $(buildConfiguration) -p:Version=$(GitVersion.majorMinorPatch) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Pack'
      inputs:
        command: 'pack'
        packagesToPack: '$(projectPath)'
        configuration: '$(buildConfiguration)'
        nobuild: true
        versioningScheme: 'byEnvVar'
        versionEnvVar: 'GITVERSION_MAJORMINORPATCH'
        outputDir: '$(Build.ArtifactStagingDirectory)/packages'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Package Artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/packages'
        ArtifactName: 'packages'
        publishLocation: 'Container'

    # Save version info as artifact for downstream stages
    - script: |
        echo "$(GitVersion.majorMinorPatch)" > $(Build.ArtifactStagingDirectory)/version.txt
      displayName: 'Save Version for Publish Stage'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Version Artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/version.txt'
        ArtifactName: 'version'
        publishLocation: 'Container'

- stage: Mirror
  displayName: 'Mirror to GitHub'
  dependsOn: Build
  # Only mirror on main branch commits (PR merges), not on PR builds
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - job: MirrorToGitHub
    displayName: 'Push to GitHub'
    steps:
    - checkout: self
      fetchDepth: 0
      persistCredentials: true

    - task: Bash@3
      displayName: 'Mirror Repository'
      inputs:
        targetType: inline
        script: |
          git config user.email "pipelines@devpossible.com"
          git config user.name "Azure Pipelines"

          echo "Adding GitHub remote..."
          git remote add github "https://$(GitHubPAT)@github.com/$(githubRepo).git"

          echo "Pushing all branches..."
          git push github --all --force

          echo "Pushing tags..."
          git push github --tags --force

          echo "Mirror complete!"
      env:
        GitHubPAT: $(GitHubPAT)

- stage: Publish
  displayName: 'Publish to NuGet.org'
  dependsOn: Mirror
  condition: succeeded()
  jobs:
  - deployment: PublishNuGet
    displayName: 'Push to NuGet.org'
    environment: 'nuget-org'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 0

          - download: current
            artifact: packages

          - download: current
            artifact: version

          - task: Bash@3
            name: ReadVersion
            displayName: 'Read Version'
            inputs:
              targetType: inline
              script: |
                VERSION=$(cat $(Pipeline.Workspace)/version/version.txt)
                echo "Version: $VERSION"
                echo "##vso[task.setvariable variable=ReleaseVersion;isOutput=true]$VERSION"

          - task: Bash@3
            displayName: 'Push to NuGet.org'
            inputs:
              targetType: inline
              script: |
                dotnet nuget push "$(Pipeline.Workspace)/packages/*.nupkg" \
                  --api-key "$(NuGetApiKey)" \
                  --source "https://api.nuget.org/v3/index.json" \
                  --skip-duplicate
            env:
              NuGetApiKey: $(NuGetApiKey)

          - task: Bash@3
            displayName: 'Tag Release'
            inputs:
              targetType: inline
              script: |
                VERSION="$(ReadVersion.ReleaseVersion)"
                echo "Tagging release: v$VERSION"

                git config user.email "pipelines@devpossible.com"
                git config user.name "Azure Pipelines"

                if git rev-parse "v$VERSION" >/dev/null 2>&1; then
                  echo "Tag v$VERSION already exists locally, skipping creation"
                else
                  git tag -a "v$VERSION" -m "Release v$VERSION"
                fi

                # Push tag to Azure DevOps
                git push origin "v$VERSION" --force 2>/dev/null || echo "Tag already on origin"

                # Push tag to GitHub for the release
                git remote add github "https://$(GitHubPAT)@github.com/$(githubRepo).git" 2>/dev/null || true
                git push github "v$VERSION" --force
                echo "Tag v$VERSION pushed to GitHub"
            env:
              GitHubPAT: $(GitHubPAT)

- stage: GitHubRelease
  displayName: 'Create GitHub Release'
  dependsOn: Publish
  condition: succeeded()
  jobs:
  - job: CreateRelease
    displayName: 'Create GitHub Release'
    steps:
    - download: current
      artifact: packages

    - download: current
      artifact: version

    - task: Bash@3
      name: ReadVersion
      displayName: 'Read Version'
      inputs:
        targetType: inline
        script: |
          VERSION=$(cat $(Pipeline.Workspace)/version/version.txt)
          echo "Version: $VERSION"
          echo "##vso[task.setvariable variable=ReleaseVersion]$VERSION"

    - task: GitHubRelease@1
      displayName: 'Create or Update GitHub Release'
      inputs:
        gitHubConnection: 'github.com_DevPossible'
        repositoryName: 'DevPossible/devpossible-pwsh-build-events'
        action: 'edit'
        target: '$(Build.SourceVersion)'
        tagSource: 'userSpecifiedTag'
        tag: 'v$(ReleaseVersion)'
        title: 'v$(ReleaseVersion)'
        isPreRelease: false
        releaseNotesSource: 'inline'
        releaseNotesInline: |
          ## DevPossible.PwshBuildEvents v$(ReleaseVersion)

          ### Installation
          ```
          dotnet add package DevPossible.PwshBuildEvents --version $(ReleaseVersion)
          ```

          ### What's Changed
          See the [full changelog](https://github.com/DevPossible/devpossible-pwsh-build-events/commits/v$(ReleaseVersion)) for details.

          ### NuGet Package
          [DevPossible.PwshBuildEvents $(ReleaseVersion) on NuGet.org](https://www.nuget.org/packages/DevPossible.PwshBuildEvents/$(ReleaseVersion))
        assets: '$(Pipeline.Workspace)/packages/*.nupkg'
        addChangeLog: false
